<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff5ee"><title>Un secret pour Kadiatou</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{color-scheme:light;--ink:#693e3c;--accent:#c66b62;--muted:#a27c75}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;font-family:'DM Sans',sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 8%,#fffdf7 0,transparent 44%),radial-gradient(circle at 8% 88%,#ffdfd3 0,transparent 31%),radial-gradient(circle at 96% 75%,#fae9c7 0,transparent 32%),#fff5ee}.stars{position:fixed;inset:0;pointer-events:none;color:#e8b28f}.stars span{position:absolute;opacity:.7;font-size:19px;animation:twinkle 3s ease-in-out infinite}.stars span:nth-child(1){top:13%;left:14%}.stars span:nth-child(2){top:22%;right:16%;animation-delay:1s}.stars span:nth-child(3){bottom:19%;left:20%;animation-delay:1.6s}.stars span:nth-child(4){bottom:13%;right:19%;animation-delay:.5s}.stars span:nth-child(5){top:48%;left:7%;font-size:11px}.stars span:nth-child(6){top:48%;right:8%;font-size:12px}.wrap{width:min(100% - 36px,600px);padding:46px 0;text-align:center}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:#ba8e80}.card{position:relative;margin-top:24px;padding:48px 32px 42px;border:1px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(255,255,255,.64);box-shadow:0 26px 90px rgba(161,93,71,.12),inset 0 1px 0 #fff;backdrop-filter:blur(16px)}.halo{width:118px;height:118px;margin:0 auto 26px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#ffe4d6 0,#fff2e7 58%,rgba(255,248,240,.15) 72%);box-shadow:0 0 45px #ffddc8}.envelope{font-size:45px;filter:drop-shadow(0 6px 7px #d69b8d44)}h1{font:500 clamp(39px,8vw,61px)/1.08 'Playfair Display',Georgia,serif;letter-spacing:-.035em;margin:0}h1 em{font-weight:500;color:var(--accent)}.subtitle{font-size:15px;line-height:1.8;color:#a27c75;margin:20px auto 27px;max-width:330px}button{border:0;border-radius:100px;background:#c96f66;color:#fff;font:600 13px 'DM Sans',sans-serif;letter-spacing:.02em;padding:17px 27px;cursor:pointer;box-shadow:0 9px 24px #c96f6642;transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-3px);box-shadow:0 13px 28px #c96f6650}button:focus-visible{outline:3px solid #893d3a;outline-offset:4px}.tiny{font-size:11px;color:#bc9a8d;letter-spacing:.04em;margin:23px 0 0}.reveal[hidden],.initial[hidden]{display:none}.reveal{animation:appear .8s both}.reveal .halo{font-size:54px;color:#d87c72}.reveal h1{font-size:clamp(42px,9vw,68px)}.signature{margin:27px 0 0;font:italic 500 23px 'Playfair Display',Georgia,serif;color:#c17769}.footer{margin:24px 0 0;color:#ba9b8e;font-size:11px;letter-spacing:.08em}.heart{color:#d78075}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}@media(max-width:480px){.card{padding:40px 22px 36px;border-radius:25px}.halo{width:105px;height:105px;margin-bottom:23px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><div class="stars" aria-hidden="true"><span>✦</span><span>✧</span><span>✧</span><span>✦</span><span>✦</span><span>✧</span></div><main class="wrap"><div class="eyebrow">Une petite attention pour toi</div><section class="card"><div class="initial" id="initial"><div class="halo"><span class="envelope" aria-hidden="true">💌</span></div><h1>Kadiatou,<br><em>un secret t’attend.</em></h1><p class="subtitle">Il y a quelque chose que je voulais te dire…</p><button id="open" type="button">Découvrir le secret &nbsp; ✦</button><p class="tiny">Une surprise rien que pour toi</p></div><div class="reveal" id="reveal" hidden aria-live="polite"><div class="halo" aria-hidden="true">♥</div><div class="eyebrow">Le secret est tout simple</div><h1 style="margin-top:18px">Alpha <em>t’aime.</em></h1><p class="subtitle">Et il voulait que tu le saches. <span class="heart">♥</span></p><p class="signature">Pour toi, Kadiatou</p></div></section><p class="footer">Fait avec <span class="heart">♥</span> pour Kadiatou</p></main><script>document.getElementById('open').addEventListener('click',function(){document.getElementById('initial').hidden=true;document.getElementById('reveal').hidden=false;});</script></body></html>
